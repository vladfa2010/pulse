# PULSE — Full Stack (Backend + PostgreSQL + Redis)
version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pulse-postgres
    environment:
      POSTGRES_DB: pulse
      POSTGRES_USER: pulse_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pulse_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse_user -d pulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pulse-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: pulse-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3001
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pulse
      DB_USER: pulse_user
      DB_PASSWORD: ${DB_PASSWORD:-pulse_password}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: 7d
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@pulse.app}
      TRANSLATION_API_KEY: ${TRANSLATION_API_KEY:-}
      RSS_FETCH_INTERVAL: 15
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    ports:
      - "3001:3001"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  # ТЗ-91 (этап 1) — TEI с Qwen3-Embedding-0.6B (dim 1024).
  # Порт наружу НЕ публикуем: бекенд ходит по внутренней сети (http://embeddings:80).
  # depends_on у backend НЕ добавляем — этап 1 не должен мешать старту бекенда.
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    container_name: pulse-embeddings
    restart: unless-stopped
    mem_limit: 3g        # v1.3: TEI RSS ~2,5–3 ГБ (fp32) — лимит с запасом
    cpus: 1.0            # v1.3: 1 ядро контейнеру, 1 ядро проду
    volumes:
      - tei_data:/data
    command: >
      --model-id Qwen/Qwen3-Embedding-0.6B
      --max-client-batch-size 32
      --max-batch-tokens 16384
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  tei_data:
