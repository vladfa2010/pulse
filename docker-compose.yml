# PULSE — боевой стек VPS (caddy + backend + postgres:18 + embeddings + clamav).
#
# ⚠️ ЕДИНСТВЕННЫЙ источник правды. На сервере этот файл (из git) лежит как
# /opt/pulse/docker-compose.yml, а /opt/pulse/pulse/docker-compose.yml —
# symlink сюда. Поэтому `docker compose` из /opt/pulse и из git-клона
# использует ОДИН конфиг (инциденты 2026-09-15 и 2026-10-01: расхождение
# боевого compose и compose клона теряло env/volumes → crash-loop).
# Все пути абсолютные — файл не зависит от каталога запуска.
#
# Секреты: /opt/pulse/.env (chmod 600, вне git). Подключены дважды:
# env_file — прямой проброс в контейнер; symlink /opt/pulse/pulse/.env →
# /opt/pulse/.env — для интерполяции ${VAR} в блоке environment (явные ключи
# environment перекрывают env_file, без symlink они получили бы дефолты).

services:
  postgres:
    # ТЗ-91: образ pgvector той же мажорной версии, что и кластер (18).
    # PGDATA явно: действующий кластер лежит в data/18/docker (наследие
    # образа postgres:18-alpine), volume postgres_data совместим.
    image: pgvector/pgvector:pg18
    container_name: pulse-postgres
    # Инцидент 2026-10-08: дефолтный /dev/shm docker'а (64MB) не позволял
    # параллельной постройке индексов (DSM "No space left on device").
    shm_size: 1gb
    environment:
      POSTGRES_DB: pulse
      POSTGRES_USER: pulse_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/18/docker
    volumes:
      - postgres_data:/var/lib/postgresql
    # Инцидент 2026-10-08: на ядре 7.0 io_uring AIO (PG18) давал зависшие
    # io worker'ы (spin 100% CPU), AioIoCompletion-таймауты и повреждённые
    # страницы news. Префетч AIO отключён (effective/maintenance_io_concurrency=0).
    # shared_buffers подняты: таблица news (~700MB) не влезала в 128MB и каждый
    # запрос шёл на диск (логин занимал 30с). Лимит памяти контейнера поднят
    # синхронно (shared_buffers не должен приближаться к лимиту cgroup).
    command: >
      postgres -c shared_buffers=384MB -c effective_cache_size=1792MB
      -c work_mem=4MB -c maintenance_work_mem=128MB -c max_connections=50
      -c effective_io_concurrency=0 -c maintenance_io_concurrency=0
      -c log_min_duration_statement=1000
      -c shared_preload_libraries=pg_stat_statements
    # ТЗ-150 задача 6: slow log (log_min_duration_statement=1000) — первичный
    # детектор запросов типа SubPlan-спина (укладываются в statement_timeout,
    # но видны в логе). pg_stat_statements — агрегатная статистика по всем
    # запросам (расширение создаётся в weekly-integrity.sh). Ротация json-лога
    # docker'а — иначе slow log на слабом диске станет сам риском.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse_user -d pulse"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 896M
    restart: unless-stopped

  backend:
    build: /opt/pulse/pulse
    container_name: pulse-backend
    env_file:
      - /opt/pulse/.env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3001
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pulse
      DB_USER: pulse_user
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: https://pulse.inside-trade.ru
      BACKEND_URL: https://pulse.inside-trade.ru
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_CHAT_MODEL: ${MINIMAX_CHAT_MODEL:-}
      MINIMAX_TTS_MODEL: ${MINIMAX_TTS_MODEL:-}
      CLUSTERING_ENABLED: ${CLUSTERING_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-none}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@pulse.inside-trade.ru}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      TRANSLATION_API_KEY: ${TRANSLATION_API_KEY:-}
      RSS_FETCH_INTERVAL: 15
      # ТЗ-115: темы только на VPS (на Render переменной нет)
      TOPICS_ENABLED: ${TOPICS_ENABLED:-false}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      FINAM_MARKET_SECRET: ${FINAM_MARKET_SECRET:-}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      YANDEX_SEARCH_API_KEY: ${YANDEX_SEARCH_API_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      FIREBASE_SERVICE_ACCOUNT_BASE64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:-}
      CRON_SECRET_KEY: ${CRON_SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # ТЗ-100: LMS storage (local driver)
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      UPLOADS_DIR: ${UPLOADS_DIR:-/app/uploads}
      SIGNED_URL_SECRET: ${SIGNED_URL_SECRET}
      SIGNED_URL_TTL_SEC: ${SIGNED_URL_TTL_SEC:-3600}
      # ТЗ-102 v2 (S4): путь к unix-сокету clamd (clamav-сервис, профиль av).
      # Без профиля каталог пуст — backend штатно деградирует: файлы висят в
      # pending_scan, в админке флаг «антивирус недоступен» (virusScan.ts).
      CLAMAV_SOCKET: /run/clamav/clamd.sock
    volumes:
      - /opt/pulse/logs:/app/logs
      # TZ70: фоновая музыка радио + SFX (bind-mount, файлы живут на хосте)
      - /opt/pulse/music:/opt/pulse/music
      - /opt/pulse/sfx:/opt/pulse/sfx
      # ТЗ-100: LMS uploads (bind-mount, бэкапится одним tar)
      - /opt/pulse/uploads:/app/uploads
      # ТЗ-102 v2 (S4): unix-сокет clamd (общий volume с clamav, ro)
      - clamav_run:/run/clamav:ro
    deploy:
      resources:
        limits:
          memory: 448M
    restart: unless-stopped

  # ТЗ-91 (этап 1) — TEI с Qwen3-Embedding-0.6B (dim 1024).
  # Порт наружу НЕ публикуем: бекенд ходит по внутренней сети (http://embeddings:80).
  # depends_on у backend НЕ добавляем — этап 1 не должен мешать старту бэкенда.
  embeddings:
    # digest закреплён после первого pull (ТЗ-91 v1.1): теги на ghcr.io
    # перезаписываемы, digest — нет
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9@sha256:ad950d30878eceb72aaf32024d26fa2b1d04a75304fa0b4776b49aa1941fea07
    container_name: pulse-embeddings
    volumes:
      - tei_data:/data
    command: >
      --model-id Qwen/Qwen3-Embedding-0.6B
      --max-client-batch-size 32
      --max-batch-tokens 4096
      --tokenization-workers 4
    # dev: 16384 из ТЗ требует ~16 ГБ RAM при прогреве TEI (warmup-аллокация),
    # на малой VDS контейнер падал; 8192 при 22 потоках не влезали даже в 8G
    # (рестарт-луп, проверено 2026-09-10) — max-batch-tokens держим 4096.
    # RAYON_NUM_THREADS ограничивает потоки candle: без ограничения warmup-спайк
    # RSS превышает лимит и процесс молча умирает (ExitCode 0, рестарт-луп).
    environment:
      - RAYON_NUM_THREADS=4
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "2.0"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: pulse-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - /opt/pulse/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/pulse/frontend/dist:/srv/dist:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped

  # ТЗ-102 v2 (S4) — ClamAV для антивирусного сканирования UGC-файлов.
  # Профиль "av": НЕ стартует с обычным `compose up -d` — clamd с базами держит
  # ~1 ГБ RAM (риски ТЗ-102 §4); запуск на VDS по мере необходимости:
  #   docker compose --profile av up -d clamav
  # Сокет проброшен named-volume'ом clamav_run в backend (ro). depends_on у
  # backend НЕ добавляем: недоступность clamd — штатная деградация (файлы в
  # pending_scan + флаг av_unavailable в очереди модерации), а не повод не
  # стартовать бэкенд.
  clamav:
    image: clamav/clamav:latest
    container_name: pulse-clamav
    profiles: ["av"]
    restart: unless-stopped
    volumes:
      - clamav_db:/var/lib/clamav   # базы сигнатур (freshclam обновляет в фоне)
      - clamav_run:/run/clamav      # unix-сокет clamd — общий с backend
    environment:
      # CLAMD_CONF_* — env-override настроек clamd официального образа:
      # явный unix-сокет (default образа может отличаться между версиями)
      CLAMD_CONF_LocalSocket: /run/clamav/clamd.sock
    healthcheck:
      # clamdcheck.sh — штатный скрипт образа (ping демона по TCP 3310);
      # start_period — первая загрузка баз свежим volume занимает минуты
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 300s

  # ТЗ-115 — one-shot кластеризация тем (HDBSCAN по эмбеддингам, 03:40 МСК cron)
  topics-worker:
    build: /opt/pulse/pulse/topics_worker
    profiles: ["worker"]
    environment:
      DATABASE_URL: postgres://pulse_user:${DB_PASSWORD}@postgres:5432/pulse
      TOPICS_WINDOW_DAYS: ${TOPICS_WINDOW_DAYS:-14}
      TOPICS_MIN_CLUSTER_SIZE: ${TOPICS_MIN_CLUSTER_SIZE:-8}
      TOPICS_MIN_SAMPLES: ${TOPICS_MIN_SAMPLES:-3}
      TOPICS_PCA_DIMS: ${TOPICS_PCA_DIMS:-50}
      TOPICS_JACCARD_THRESHOLD: ${TOPICS_JACCARD_THRESHOLD:-0.3}
    depends_on: [postgres]
    restart: "no"
    mem_limit: 2g

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  tei_data:
  clamav_db:
  clamav_run:
