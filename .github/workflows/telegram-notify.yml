name: Telegram Notify

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram alert
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          COMMIT_MSG='${{ github.event.head_commit.message }}'
          # Escape for JSON: backslash, double quote, newline, tab
          ESCAPED_MSG=$(printf '%s' "$COMMIT_MSG" | sed 's/\\/\\\\/g; s/"/\\"/g; s/\t/\\t/g' | tr '\n' ' ')

          REPO='${{ github.repository }}'
          BRANCH='${{ github.ref_name }}'
          AUTHOR='${{ github.event.head_commit.author.name }}'
          SHA_SHORT='${{ github.event.head_commit.id }}'
          SHA_SHORT=${SHA_SHORT:0:7}
          URL='${{ github.event.head_commit.url }}'

          TEXT=$(cat <<EOF
<b>🚀 PULSE push</b>

<b>Репозиторий:</b> ${REPO}
<b>Ветка:</b> ${BRANCH}
<b>Автор:</b> ${AUTHOR}
<b>Коммит:</b> <code>${SHA_SHORT}</code>

${ESCAPED_MSG}

<a href=\"${URL}\">Открыть коммит</a>
EOF
          )

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${CHAT_ID}\",\"text\":\"${TEXT}\",\"parse_mode\":\"HTML\",\"disable_web_page_preview\":true}"
