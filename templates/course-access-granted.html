<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Доступ к курсу — PULSE</title>
  <style>
    body { margin: 0; padding: 0; background: #0A0A0A; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .container { max-width: 600px; margin: 0 auto; background: #0F0F0F; }
    .header { padding: 32px 24px 16px; text-align: center; border-bottom: 1px solid #1a1a1a; }
    .logo { color: #00D4FF; font-size: 20px; font-weight: 700; letter-spacing: 2px; }
    .subtitle { color: #6B7280; font-size: 12px; margin-top: 4px; }
    .section { padding: 32px 24px; text-align: center; border-bottom: 1px solid #1a1a1a; }
    .title { color: #D1D5DB; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
    .text { color: #9CA3AF; font-size: 15px; line-height: 1.7; }
    .course { color: #fff; font-weight: 600; }
    .cta { padding: 24px; text-align: center; }
    .cta-button { display: inline-block; padding: 14px 32px; background: #00D4FF; color: #000; font-size: 14px; font-weight: 600; text-decoration: none; border-radius: 12px; }
    .footer { padding: 24px; text-align: center; color: #4B5563; font-size: 11px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">PULSE</div>
      <div class="subtitle">Образование</div>
    </div>
    <div class="section">
      <div class="title">Доступ открыт</div>
      <div class="text">Вам предоставлен доступ к курсу <span class="course">«{{courseTitle}}»</span>.</div>
    </div>
    <div class="cta">
      <a href="{{courseUrl}}" class="cta-button">Изучить</a>
    </div>
    <div class="footer">
      Вы получили это письмо, потому что администратор записал вас на курс.<br>
      PULSE — новости и обучение для инвестора
    </div>
  </div>
</body>
</html>
